name: Release Build

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build Server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd server
          cargo build --release
          Copy-Item target/release/server.exe ../MobileSpeaker.exe -Force

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-speaker-windows
          path: MobileSpeaker.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Build Android APK
        env:
          AS2P_KEYSTORE_B64: ${{ secrets.AS2P_KEYSTORE_B64 }}
          AS2P_KEYSTORE_PASSWORD: ${{ secrets.AS2P_KEYSTORE_PASSWORD }}
          AS2P_KEY_ALIAS: ${{ secrets.AS2P_KEY_ALIAS }}
          AS2P_KEY_PASSWORD: ${{ secrets.AS2P_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          if [ -n "$AS2P_KEYSTORE_B64" ] && [ -n "$AS2P_KEYSTORE_PASSWORD" ] && [ -n "$AS2P_KEY_ALIAS" ] && [ -n "$AS2P_KEY_PASSWORD" ]; then
            echo "$AS2P_KEYSTORE_B64" | base64 -d > app/release.keystore
            {
              echo "storeFile=app/release.keystore"
              echo "storePassword=$AS2P_KEYSTORE_PASSWORD"
              echo "keyAlias=$AS2P_KEY_ALIAS"
              echo "keyPassword=$AS2P_KEY_PASSWORD"
            } > keystore.properties
            gradle assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../MobileSpeaker-android.apk
          else
            echo "Release signing secrets not configured; building installable debug-signed APK."
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../MobileSpeaker-android.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-speaker-android
          path: MobileSpeaker-android.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Server
        uses: actions/download-artifact@v4
        with:
          name: mobile-speaker-windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-speaker-android

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MobileSpeaker.exe
            MobileSpeaker-android.apk
          name: Mobile Speaker ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
